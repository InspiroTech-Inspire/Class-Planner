<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Planner — Weekly Coursework Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📒</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- Sidebar: the "binder spine" -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="sidebar-mark" aria-hidden="true">§</span>
      <div>
        <h1 class="sidebar-title">Class Planner</h1>
        <p class="sidebar-sub">Weekly coursework ledger</p>
      </div>
    </div>

    <nav class="class-list" id="classList" aria-label="Classes"></nav>

    <button class="btn-add-class" id="openAddClass" type="button">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Add a class
    </button>

    <form class="add-class-form" id="addClassForm" hidden>
      <input type="text" id="newClassName" placeholder="e.g. Biology 101" autocomplete="off" maxlength="60">
      <div class="add-class-actions">
        <button type="submit" class="btn-primary-sm">Create</button>
        <button type="button" class="btn-ghost-sm" id="cancelAddClass">Cancel</button>
      </div>
    </form>
  </aside>

  <!-- Main: the ledger page -->
  <main class="main" id="main">
    <!-- rendered by app.js -->
  </main>

</div>

<template id="entryRowTemplate"></template>

<script src="app.js"></script>
</body>
</html>
